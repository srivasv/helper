name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Install isolated integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core \
            dbus-x11 xvfb xauth xdotool x11-utils xclip zenity kdialog
      - run: cargo build --locked
      - name: Test paste shortcuts and post-paste edits over real IPC
        run: /usr/bin/python3 parity_test.py target/debug/wispr-flow-linux-helper
      - name: Test GTK4 and Qt edits with focus events and fallback search
        run: |
          cargo test --locked --no-run --message-format=json > /tmp/helper-tests.json
          /usr/bin/python3 edit_observation_test.py /tmp/helper-tests.json
      - name: Test deep editors and active-window focus discovery
        run: WISPR_EDIT_TEST_ISOLATED=1 dbus-run-session -- cargo test focus_discovery_boundaries -- --ignored
      - name: Test rich-text privacy and resource boundaries
        run: WISPR_EDIT_TEST_ISOLATED=1 dbus-run-session -- cargo test rich_text_boundaries -- --ignored
      - name: Test Chromium rich-text edits with events and lazy accessibility
        run: |
          CHROMIUM_BIN="$(command -v google-chrome)" /usr/bin/python3 \
            edit_observation_test.py /tmp/helper-tests.json --chromium
